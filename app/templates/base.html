<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    
    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">

    <style>
        /* Tối ưu co giãn chung cho mọi màn hình */
        body {
            background-color: #f8fafc;
            color: #1e293b;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            padding-left: 12px;
            padding-right: 12px;
        }

        /* Tiêu đề tự động co giãn kích thước theo màn hình */
        .app-title {
            font-size: clamp(1.25rem, 4vw, 1.75rem);
            font-weight: 700;
            color: #0f172a;
        }

        /* Tối ưu nhóm nút bấm trên thanh nav cho mobile */
        .app-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        /* Chuẩn hóa kích thước các nút bấm trên mobile/desktop */
        .app-nav .btn {
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        /* Riêng nút Thoát (Logout) */
        .btn-logout {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            text-decoration: none;
        }
        .btn-logout:hover {
            background: #fee2e2;
            color: #b91c1c;
        }

        /* Tinh chỉnh riêng cho màn hình điện thoại nhỏ <= 5.5 inch */
        @media (max-width: 480px) {
            .container {
                padding-left: 8px;
                padding-right: 8px;
                margin-top: 12px !important;
            }
            .app-nav {
                display: grid;
                grid-template-columns: repeat(2, 1fr); /* Chia đôi hàng nút cho dễ bấm */
                gap: 6px;
            }
            .app-nav .btn {
                width: 100%;
                justify-content: center;
                padding: 10px 8px;
            }
            /* Nút Dashboard hoặc Thoát có thể chiếm full nếu muốn, ở đây để chia đôi rất đẹp */
        }
    </style>
</head>
<body>

<div class="container mt-3 mt-md-4">

    <!-- Tiêu đề -->
    <h2 class="app-title mb-3 mb-md-4">
        🖨 Thư viện Máy in Đại Thành
    </h2>

    <!-- Thanh điều hướng tự động co giãn -->
    <nav class="mb-4 app-nav">
        <a class="btn btn-outline-primary" href="/">
            🏠 Trang chủ
        </a>

        <a class="btn btn-outline-dark" href="/admin">
            📊 Dashboard
        </a>

        <!-- Nút Đăng xuất (Logout) -->
        <a href="/admin/logout" class="btn btn-logout">
            <span>🚪</span> Thoát
        </a>
    </nav>

    <!-- Khối nội dung động kế thừa từ các trang con -->
    {% block content %}

    {% endblock %}

</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script tự động xóa thông báo sau 3 giây -->
<script>
    setTimeout(function () {
        document.querySelectorAll(".alert").forEach(function(item){
            item.remove();
        });
    }, 3000);
</script>

</body>
</html>
