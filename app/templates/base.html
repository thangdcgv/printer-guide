<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}{{ title or "Thư viện Máy in Đại Thành" }}{% endblock %}</title>
    
    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">

    <style>
        /* =========================================================
        KỶ LUẬT THÉP: CHỐNG TRÀN NGANG (CSS RESET CHUYÊN NGHIỆP)
        ========================================================= */

        /* 1. Ép mọi phần tử tính toán padding vào trong kích thước tổng */
        *, *::before, *::after {
            box-sizing: border-box !important;
            max-width: 100vw; /* Không phần tử nào được phép rộng hơn màn hình */
        }

        /* 2. Khóa vĩnh viễn cuộn ngang trên toàn bộ trang */
        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden !important; 
            margin: 0;
            padding: 0;
        }

        /* 3. Ép toàn bộ hình ảnh phải co giãn theo khung, không được phình ra */
        img {
            max-width: 100% !important;
            height: auto !important;
            object-fit: contain;
        }

        /* 4. Tự động bẻ dòng các đoạn text hoặc link quá dài */
        p, a, span, div, h1, h2, h3, h4, h5, h6 {
            word-break: break-word;
            overflow-wrap: anywhere;
        }
        /* Tối ưu co giãn chung cho mọi màn hình */
        body {
            background-color: #f8fafc;
            color: #1e293b;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent; /* Bỏ khung xanh khi bấm trên Chrome Android */
        }

        .container {
            max-width: 1100px;
            width: 100%;
            padding-left: 12px;
            padding-right: 12px;
        }

        /* Tiêu đề tự động co giãn kích thước theo màn hình */
        .app-title {
            font-size: clamp(1.25rem, 4vw, 1.75rem);
            font-weight: 700;
            color: #0f172a;
        }

        /* Tối ưu nhóm nút bấm trên thanh nav cho mobile */
        .app-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        /* Chuẩn hóa kích thước các nút bấm */
        .app-nav .btn {
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }

        /* Riêng nút Thoát (Logout) */
        .btn-logout {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            text-decoration: none;
        }
        .btn-logout:hover {
            background: #fee2e2;
            color: #b91c1c;
        }

        /* Tinh chỉnh riêng cho màn hình điện thoại nhỏ <= 480px */
        @media (max-width: 480px) {
            .container {
                padding-left: 8px;
                padding-right: 8px;
                margin-top: 10px !important;
            }
            .app-nav {
                display: grid;
                grid-template-columns: repeat(2, 1fr); /* Chia 2 cột đều nhau */
                gap: 6px;
            }
            .app-nav .btn {
                width: 100%;
                padding: 10px 8px; /* Tăng chiều cao để ngón tay dễ bấm */
            }
        }
    </style>
</head>
<body>

<div class="container mt-3 mt-md-4 mb-4">

    <!-- Tiêu đề -->
    <h2 class="app-title mb-3 mb-md-4">
        🖨 Thư viện Máy in Đại Thành
    </h2>

    <!-- Thanh điều hướng -->
    <nav class="mb-3 mb-md-4 app-nav">
        <a class="btn btn-outline-primary" href="/">
            🏠 Trang chủ
        </a>

        <a class="btn btn-outline-dark" href="/admin">
            📊 Dashboard
        </a>

        <!-- Nút Đăng xuất (Logout) -->
        <a href="/admin/logout" class="btn btn-logout">
            <span>🚪</span> Thoát
        </a>
    </nav>

    <!-- Khu vực hiển thị thông báo chung (Flash Messages) nếu có -->
    <div id="alert-container">
        {% block alerts %}{% endblock %}
    </div>

    <!-- Khối nội dung động kế thừa từ các trang con -->
    {% block content %}

    {% endblock %}

</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script tự động ẩn thông báo mượt mà sau 3.5 giây -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
            document.querySelectorAll(".alert").forEach(function(alertEl){
                // Sử dụng API chính thức của Bootstrap để đóng mượt mà
                var bsAlert = bootstrap.Alert.getOrCreateInstance(alertEl);
                if (bsAlert) {
                    bsAlert.close();
                }
            });
        }, 3500);
    });
</script>

</body>
</html>
