<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}{{ title or "Thư viện Máy in Đại Thành" }}{% endblock %}</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">

    <style>
        /* =========================================================
           CSS RESET & NORMALIZE (CHỐNG TRÀN NGANG CHUẨN MỰC)
        ========================================================= */

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            overflow-x: hidden !important; 
            margin: 0;
            padding: 0;
            background-color: #f8fafc;
            color: #1e293b;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Co giãn hình ảnh & media an toàn */
        img, svg, video {
            max-width: 100% !important;
            height: auto !important;
            object-fit: contain;
        }

        /* Chỉ bẻ dòng văn bản ở các thẻ chứa nội dung dài, không bẻ dòng trên Nút/Nav */
        p, .content-text, table td {
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            padding-left: 12px;
            padding-right: 12px;
        }

        /* Tiêu đề tự động co giãn kích thước theo màn hình */
        .app-title {
            font-size: clamp(1.25rem, 4vw, 1.75rem);
            font-weight: 700;
            color: #0f172a;
        }

        /* Tối ưu thanh điều hướng Flexbox */
        .app-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .app-nav .nav-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* Chuẩn hóa kích thước nút bấm - Giữ nguyên chữ không bị rớt dòng */
        .app-nav .btn {
            font-size: 0.875rem;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap; /* Giữ chữ trên nút luôn cố định 1 dòng */
        }

        /* Nút Đăng nhập */
        .btn-login {
            background: #ffffff;
            color: #475569;
            border: 1px solid #cbd5e1;
            text-decoration: none;
        }
        .btn-login:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        /* Nút Thoát (Logout) */
        .btn-logout {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            text-decoration: none;
        }
        .btn-logout:hover {
            background: #fee2e2;
            color: #b91c1c;
        }

        /* Responsive cho Mobile <= 480px */
        @media (max-width: 480px) {
            .container {
                padding-left: 10px;
                padding-right: 10px;
                margin-top: 10px !important;
            }
            .app-nav .btn {
                padding: 8px 10px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

<div class="container mt-3 mt-md-4 mb-4">

    <!-- Tiêu đề trang -->
    <h2 class="app-title mb-3 mb-md-4">
        <a href="/" class="text-decoration-none text-dark">🖨 Thư viện Máy in Đại Thành</a>
    </h2>

    <!-- Thanh điều hướng chuẩn hóa layout -->
    <nav class="mb-3 mb-md-4 app-nav">
        <!-- Cụm bên trái: Trang chính -->
        <div class="nav-group">
            <a class="btn btn-outline-primary" href="/">
                🏠 Trang chủ
            </a>
            {% if user or request.cookies.get("user_session") %}
                <a class="btn btn-outline-dark" href="/admin">
                    📊 Dashboard
                </a>
            {% endif %}
        </div>

        <!-- Cụm bên phải: Trạng thái tài khoản -->
        <div class="nav-group ms-auto">
            {% if user or request.cookies.get("user_session") %}
                <a href="/admin/logout" class="btn btn-logout">
                    🚪 Thoát
                </a>
            {% else %}
                <a href="/admin/login" class="btn btn-login">
                    🔑 Đăng nhập
                </a>
            {% endif %}
        </div>
    </nav>

    <!-- Khu vực hiển thị thông báo chung (Flash Messages) -->
    <div id="alert-container">
        {% block alerts %}{% endblock %}
    </div>

    <!-- Khối nội dung động kế thừa từ các trang con -->
    {% block content %}

    {% endblock %}

</div>

<!-- Bootstrap 5.3.3 JS Bundle (Đã bỏ thẻ <link> chèn thừa) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script tự động ẩn thông báo mượt mà sau 3.5 giây -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
            document.querySelectorAll(".alert").forEach(function(alertEl){
                var bsAlert = bootstrap.Alert.getOrCreateInstance(alertEl);
                if (bsAlert) {
                    bsAlert.close();
                }
            });
        }, 3500);
    });
</script>

</body>
</html>
