{% extends "base.html" %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto; padding: 20px 0; font-family: 'Inter', sans-serif;">
    <a href="/admin/library{% if folder_id %}?folder_id={{ folder_id }}{% endif %}" style="color: #64748b; text-decoration: none; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 16px;">
        ← Quay lại thư viện
    </a>

    <div style="background: #ffffff; padding: 28px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 8px rgba(0,0,0,.04);">
        <h2 style="font-size: 1.25rem; font-weight: 700; color: #0f172a; margin-top: 0; margin-bottom: 20px;">🔗 Thêm Tài Nguyên / Liên Kết OneDrive</h2>

        <form action="/admin/library/resource/create" method="POST">
            
            <!-- Chọn thư mục chứa tài nguyên -->
            <div style="margin-bottom: 16px;">
                <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; color: #1e293b;">Thuộc thư mục</label>
                <select name="folder_id" required style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; box-sizing: border-box; background: white;">
                    <option value="">-- Chọn thư mục lưu trữ --</option>
                    {% for f in folders %}
                    <option value="{{ f.id }}" {% if folder_id and folder_id == f.id %}selected{% endif %}>
                        📁 {{ f.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div style="margin-bottom: 16px;">
                <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; color: #1e293b;">Tiêu đề tài nguyên</label>
                <input type="text" name="title" required placeholder="Ví dụ: Driver Canon G3010 Win 64bit, Tài liệu hướng dẫn sửa lỗi..." style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 16px;">
                <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; color: #1e293b;">Loại tài nguyên</label>
                <select name="resource_type" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; box-sizing: border-box; background: white;">
                    <option value="onedrive_file">📊 OneDrive File</option>
                    <option value="onedrive_folder">🗂️ OneDrive Folder</option>
                    <option value="driver">🖨️ Driver Máy In</option>
                    <option value="firmware">⚙️ Firmware / Reset Key</option>
                    <option value="pdf">📄 Tài liệu PDF</option>
                    <option value="video">🎥 Video hướng dẫn</option>
                    <option value="zip">🜜 Tệp nén (ZIP/RAR)</option>
                    <option value="website">🌐 Website / Link liên kết</option>
                </select>
            </div>

            <div style="margin-bottom: 16px;">
                <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; color: #1e293b;">Đường dẫn (URL OneDrive / Link tải)</label>
                <input type="url" name="url" required placeholder="https://onedrive.live.com/..." style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; color: #1e293b;">Mô tả chi tiết</label>
                <textarea name="description" rows="3" placeholder="Ghi chú về phiên bản, dung lượng hoặc lưu ý..." style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; box-sizing: border-box;"></textarea>
            </div>

            <button type="submit" style="background: #059669; color: white; padding: 10px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; font-size: 0.95rem;">
                Lưu Tài Nguyên
            </button>
        </form>
    </div>
</div>
{% endblock %}
