{% extends "base.html" %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto; padding: 20px 0; font-family: 'Inter', sans-serif;">
    <a href="/admin/library{% if parent_id %}?folder_id={{ parent_id }}{% endif %}" style="color: #64748b; text-decoration: none; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 16px;">
        ← Quay lại thư viện
    </a>

    <div style="background: #ffffff; padding: 28px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 8px rgba(0,0,0,.04);">
        <h2 style="font-size: 1.25rem; font-weight: 700; color: #0f172a; margin-top: 0; margin-bottom: 20px;">📁 Tạo Thư Mục Mới</h2>

        <form action="/admin/library/folder/create" method="POST">
            <!-- Nếu có parent_id thì truyền ngầm để giữ cấp độ thư mục cha -->
            {% if parent_id %}
            <input type="hidden" name="parent_id" value="{{ parent_id }}">
            {% endif %}

            <div style="margin-bottom: 16px;">
                <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; color: #1e293b;">Tên thư mục</label>
                <input type="text" name="name" required placeholder="Ví dụ: Driver Máy In Canon, Tài Liệu Nội Bộ..." style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; color: #1e293b;">Mô tả (tùy chọn)</label>
                <textarea name="description" rows="3" placeholder="Ghi chú về thư mục này..." style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; box-sizing: border-box;"></textarea>
            </div>

            <button type="submit" style="background: #2563eb; color: white; padding: 10px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; font-size: 0.95rem;">
                Tạo Thư Mục
            </button>
        </form>
    </div>
</div>
{% endblock %}
